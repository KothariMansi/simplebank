name: Deploy to production

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Load secrets and save to app.env
      run: |
        az keyvault secret show --vault-name simplebank-kv --name simplebank-config --query value --output tsv | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > app.env

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: simplebank.azurecr.io
        username: ${{ secrets.ACR_CLIENT_ID }}
        password: ${{ secrets.ACR_CLIENT_SECRET }}

    - name: Build, tag, and push image
      run: |
        docker build -t simplebank.azurecr.io/simplebank:${{ github.sha }} .
        docker push simplebank.azurecr.io/simplebank:${{ github.sha }}