name: Deploy to production

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate app.env
      run: |
        cat <<EOF > app.env
        POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB=${{ secrets.POSTGRES_DB }}
        DB_DRIVER=${{ secrets.DB_DRIVER }}
        DB_SOURCE=${{ secrets.DB_SOURCE }}
        SERVER_ADDRESS=${{ secrets.SERVER_ADDRESS }}
        TOKEN_SYMMETRIC_KEY=${{ secrets.TOKEN_SYMMETRIC_KEY }}
        ACCESS_TOKEN_DURATION=15m
        EOF

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: simplebank.azurecr.io
        username: ${{ secrets.ACR_CLIENT_ID }}
        password: ${{ secrets.ACR_CLIENT_SECRET }}

    - name: Build, tag, and push image
      run: |
        docker build -t simplebank.azurecr.io/simplebank:${{ github.sha }} .
        docker push simplebank.azurecr.io/simplebank:${{ github.sha }}