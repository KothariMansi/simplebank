name: Deploy to production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Azure login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Load secrets and save to app.env
      shell: bash
      run: |
        az keyvault secret show --vault-name simplebank-kv --name simplebank-config --query value --output tsv | jq -r 'to_entries|map("\(.key)=\(.value)")|.[]' > app.env
        grep -q '^DB_SOURCE=.' app.env

    - name: Login to ACR
      uses: docker/login-action@v3
      with:
        registry: simplebank.azurecr.io
        username: ${{ secrets.ACR_CLIENT_ID }}
        password: ${{ secrets.ACR_CLIENT_SECRET }}

    - name: Build, tag, and push image
      run: |
        docker build -t simplebank.azurecr.io/simplebank:${{ github.sha }} -t simplebank.azurecr.io/simplebank:latest .
        docker push --all-tags simplebank.azurecr.io/simplebank

    - name: Update kube config
      run: az aks get-credentials --resource-group practice-rg --name simple-bank --overwrite-existing

    - name: Deploy to AKS
      run: |
        sed -i "s|image: simplebank.azurecr.io/simplebank:.*|image: simplebank.azurecr.io/simplebank:${{ github.sha }}|" aks/deployment.yaml
        kubectl apply -f aks/deployment.yaml
        kubectl apply -f aks/service.yaml
        kubectl apply -f aks/issuer.yaml
        kubectl apply -f aks/ingress.yaml
        kubectl rollout status deployment/simple-bank-api-deployment --timeout=180s